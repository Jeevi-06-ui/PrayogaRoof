<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="#0B0F19"/>
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="url(#grad)" stroke-width="6" opacity="0.4"/>
  <!-- Coordinate Grid lines -->
  <path d="M 60 256 L 452 256 M 256 60 L 256 452" stroke="#1E293B" stroke-width="4" stroke-dasharray="8 8"/>
  <!-- Parabola / Math curve -->
  <path d="M 120 400 Q 256 120 392 400" fill="none" stroke="url(#grad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Pi symbol & Sigma -->
  <circle cx="256" cy="180" r="16" fill="#F59E0B"/>
  <text x="256" y="320" font-family="system-ui, sans-serif" font-size="110" font-weight="900" fill="#FFFFFF" text-anchor="middle" filter="url(#glow)">P²</text>
  <text x="256" y="440" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#06B6D4" text-anchor="middle" letter-spacing="4">PRAYOGAPROOF</text>
</svg>
